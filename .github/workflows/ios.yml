name: iOS

# The iOS lane had no gate at all until now: `ci.yml` is scoped to `api/**`, so an iOS-only pull
# request reported a reassuring nothing, and "the tests passed on my machine" was the only
# assurance anyone had. Tolerable at one branch; not once two people — or two agents — are
# landing Swift.
#
# Deliberately its own workflow rather than a job inside `ci.yml`. macOS runners bill at **ten
# times** the Linux rate, so the filters below have to stay tight, and a separate file makes it
# obvious what triggers the expensive thing.
#
# Measured, not guessed: a run here takes 3–7 minutes of wall clock, which bills as 30–70. That
# is 1.5–3.5% of a Free plan's entire monthly allowance **per run**, so what triggers this is a
# budget decision rather than a style one.
on:
  # **`main` only, not `["**"]`.** A push to a branch with an open pull request used to fire
  # this twice — once for the push and once for the pull request — on different concurrency
  # groups, so neither cancelled the other and every push cost double. `pull_request` already
  # tests the *merge result*, which is the thing that matters; this leg is here so a direct
  # push to main is still gated.
  push:
    branches: [main]
    paths:
      - 'ios/**'
      # Markdown under ios/ — reports, the device session — cannot change a build. Excluded so
      # editing a document does not spend a macOS runner. Negations must come after the pattern
      # they narrow; GitHub applies these in order.
      - '!ios/**.md'
      - '.github/workflows/ios.yml'
  pull_request:
    # `ready_for_review` is in the list because of the `draft` guard on the job below: without
    # it, marking a draft ready would never trigger the run the guard deferred.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ios/**'
      - '!ios/**.md'
      - '.github/workflows/ios.yml'

concurrency:
  # Cancel superseded runs. Unlike deploy there is nothing half-applied to protect, and a queued
  # macOS runner is the most expensive idle thing in this repo.
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # **Drafts do not spend a macOS runner.** A draft in this repo means work that is paused or
    # blocked — the stop-condition procedure says to open one — and paying 40 billed minutes per
    # push to tell someone their unfinished branch is unfinished is not worth it. Marking the
    # pull request ready runs it, via `ready_for_review` above.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    # Observed range is 3–7 minutes. 12 leaves nearly double the headroom over the worst run
    # seen and caps a hung job at 120 billed minutes instead of 250.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcodes and default to one that is not necessarily ours.
      # Selecting explicitly means an image update cannot silently change the compiler, and
      # printing it means the log says which was used.
      - name: Select and report Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # Config.xcconfig is gitignored — it holds the dev child id and the API host — so CI has to
      # create one. The values are never contacted: there are no network tests, by design. What
      # matters is the *shape*, so a key added to the example but not produced by it fails here
      # rather than resolving to empty at build time.
      - name: Provide a build configuration
        run: |
          set -euo pipefail
          cp ios/Rascal/Config.xcconfig.example ios/Rascal/Config.xcconfig

          missing=""
          for key in API_SCHEME API_HOST API_BASE_URL DEV_LOGIN_EMAIL DEV_CHILD_ID; do
            grep -qE "^${key} *=" ios/Rascal/Config.xcconfig || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Config.xcconfig.example is missing:${missing}"
            exit 1
          fi

      # `generic/platform=iOS Simulator` builds but cannot test — xcodebuild refuses with
      # "Tests must be run on a concrete device". Hardcoding a name is the other trap: whichever
      # iPhone the image ships changes, and the failure is "device not found" on a green
      # codebase. So: discover one at runtime and use its UDID.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Plain shell on purpose. Embedded multi-line Python inside a YAML block scalar
          # breaks the file's indentation, which cost two runs here before this comment existed.
          # `simctl list devices available` prints "    iPhone 17 Pro (UDID) (Shutdown)".
          udid=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | tail -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -F "$udid"

          # Start it booting now rather than letting `xcodebuild test` do it later. `simctl
          # boot` initiates the boot and returns — it does not wait for the device to come up,
          # which is `bootstatus` — so the boot overlaps the compile in the next step instead
          # of running after it. Booting a simulator is a meaningful slice of this job, and at
          # ten times the Linux rate a minute of it is worth overlapping.
          # `|| true`: an already-booted device exits non-zero, which is not a failure here.
          xcrun simctl boot "$udid" || true

      # No xcbeautify: it is not guaranteed present, and a prettier log is not worth a
      # dependency that can vanish. No `-quiet` either, for a sharper reason — the warning gate
      # below greps this log, and quieting the build is how that gate silently starts passing.
      #
      # The three settings below are free and slightly positive, and that is the honest size of
      # them — **not** where the savings in this file come from. Measured cold and locally they
      # take a ~6s compile to ~5s; this job takes 3–7 minutes, so compilation is not what it is
      # spending. The savings are in running the job half as often. Kept because they cost
      # nothing and each is defensible on its own:
      #   COMPILER_INDEX_STORE_ENABLE=NO  — the index is for an editor. Nothing on this runner
      #                                     opens one, and building it is pure cost.
      #   ONLY_ACTIVE_ARCH=YES            — one simulator, one architecture.
      #   -disableAutomaticPackageResolution — rule 4 of ios/CLAUDE.md: there are no third-party
      #                                     dependencies, so this can only ever be a network
      #                                     round trip that resolves nothing.
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/Rascal/Rascal.xcodeproj \
            -scheme Rascal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee xcodebuild.log
          echo "--- result ---"
          grep -E "Test run with|Executed .* test" xcodebuild.log | tail -3 || true

      # A warning introduced today is a warning ignored forever. Grepping the log rather than
      # parsing an .xcresult bundle: the bundle's schema moves between Xcode versions and the
      # parsing breaks silently, whereas a compiler warning has said `path:line: warning:` for
      # twenty years. Scoped to this project's own sources so SDK and toolchain noise cannot
      # fail a build for something nobody here can fix.
      #
      # **Every source directory has to be named here.** The alternation requires a `/` straight
      # after the branch, so `RascalWidget/` was invisible to `(Rascal|RascalTests)` rather than
      # covered by its first branch — the widget target shipped with an ungated build for exactly
      # as long as it took to notice. A new target means a new branch in this list.
      - name: No new warnings in our own sources
        if: success()
        run: |
          set -uo pipefail
          grep -E "ios/Rascal/(Rascal|RascalTests|RascalWidget)/.*: warning:" xcodebuild.log | sort -u > ours.txt || true
          count=$(wc -l < ours.txt | tr -d ' ')
          echo "warnings in ios/Rascal/{Rascal,RascalTests,RascalWidget}: ${count}"
          if [ "$count" != "0" ]; then
            sed 's/^/::error::/' ours.txt
            exit 1
          fi

      - name: Keep the log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS"
            echo ""
            echo "- scheme: \`Rascal\`, generic iOS Simulator"
            echo "- \`$(xcodebuild -version | head -1)\`"
            grep -E "Test run with" xcodebuild.log | tail -1 || true
          } >> "$GITHUB_STEP_SUMMARY"
