name: CI

# Scoped to the API lane. This is a two-lane monorepo: a commit that only touches `ios/`
# has nothing for the Python suite to say, and running it anyway trains everyone to ignore
# a green check that proved nothing. `.github/scripts/**` is in the filter because the lint
# job lints `../.github` — leave it out and the backup pruner silently stops being checked.
#
# `main` only on the push leg, not `["**"]`. A push to a branch with an open pull request used
# to fire this twice — once for the push, once for the pull request — on different concurrency
# groups, so neither cancelled the other. `pull_request` tests the merge result, which is the
# thing that matters; the push leg is here so a direct push to main is still gated.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Every job in this file was unbounded, and an unbounded job is six hours by default.
    # Ruff over ninety files is seconds; five minutes is already absurd headroom.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
        working-directory: api
      # `.github/scripts` too — the backup pruner and the schema verifier are real Python
      # that nothing else lints, and both run against production data.
      - run: uv run ruff check . ../.github
        working-directory: api
      - run: uv run ruff format --check . ../.github
        working-directory: api

  # The one path in this repo that nothing else executes. `api/fly.toml` deploys this exact
  # Dockerfile, so a build failure here is a deploy failure — discovered on a push instead of
  # on deploy day. Needs no credentials, which is the whole reason it can exist.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Context is api/, not the repo root: every COPY in the Dockerfile is relative to it.
      - name: Build the image Fly deploys
        run: docker build --progress=plain -f api/Dockerfile api/

  test:
    runs-on: ubuntu-latest
    # The suite is ~30 seconds locally against a real Postgres. Ten covers a cold uv sync,
    # the Postgres 16 client install, and the dump/restore round trip with room to spare.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rascal
          POSTGRES_PASSWORD: rascal
          POSTGRES_DB: rascal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rascal -d rascal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://rascal:rascal@localhost:5433/rascal
      JWT_SECRET: ci-secret-not-for-production
      S3_BUCKET: rascal-media-ci
      S3_REGION: us-east-2
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      APPLE_BUNDLE_ID: com.travisterry.childarchive
    steps:
      - uses: actions/checkout@v4
      # tests/test_restore.py performs a real pg_dump/psql round trip, so the client major
      # has to *match* Postgres 16 — not merely be recent. A newer client is the dangerous
      # direction: pg_dump 17 writes `SET transaction_timeout` into the dump header, Postgres
      # 16 does not recognise that parameter, and the restore dies under ON_ERROR_STOP with
      # an error that never mentions versions. The old ` 1[6-9]\.` test accepted exactly that
      # client and only passed because today's runner image still ships 16.
      - name: Ensure a Postgres 16 client
        run: |
          set -euo pipefail
          if ! pg_dump --version | grep -qE ' 16\.'; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-16
            # Debian's /usr/bin/pg_dump is pg_wrapper, which dispatches to the *newest*
            # installed version. Installing 16 alongside a 17 is therefore not enough on its
            # own — 16 has to come first on PATH for the rest of the job.
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
            export PATH="/usr/lib/postgresql/16/bin:$PATH"
          fi
          pg_dump --version | grep -qE ' 16\.' \
            || { echo "::error::pg_dump is not 16 after setup: $(pg_dump --version)"; exit 1; }
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
        working-directory: api
      - run: uv run pytest -q
        working-directory: api
