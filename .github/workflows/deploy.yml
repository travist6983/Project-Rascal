name: Deploy

# Deploying must never require a laptop. This runs on a push to main, and on demand from
# the GitHub mobile app via the "Run workflow" button.
#
# The path filter keeps an iOS-only commit from deploying an API that did not change. A
# no-op deploy is not harmless: it restarts machines and re-runs the Alembic release
# command against production for no reason. `workflow_dispatch` takes no path filter, so
# "deploy whatever is on main right now" stays available on demand.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never two deploys at once, and never cancel one halfway — a cancelled deploy can leave
# the release command half-applied.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FLY_APP: rascal-api
  HEALTH_TIMEOUT_SECONDS: 90

jobs:
  deploy:
    # Until the Fly app exists there is nothing to deploy to, and a push to main should not
    # paint the commit red for that. Skipped is the honest state — it is neither a success
    # nor a failure, and it renders grey rather than as a green check that would claim a
    # deploy happened. Flip this on when the app is created, alongside FLY_API_TOKEN:
    #   Settings -> Secrets and variables -> Actions -> Variables -> FLY_DEPLOY_ENABLED=true
    # Deliberately a variable and not the secret itself: GitHub does not expose `secrets` to
    # a job-level `if`, and reading it in a prior job would make a missing token look like a
    # clean skip forever after — including the day someone revokes it. A manual dispatch
    # always runs, so "is deployment wired up yet" stays answerable on demand.
    if: github.event_name == 'workflow_dispatch' || vars.FLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Add it under"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::Generate one with: fly tokens create deploy --app $FLY_APP"
            exit 1
          fi

      # Migrations run here and nowhere else. fly.toml sets
      #   release_command = "alembic upgrade head"
      # so Fly applies them once, before the new machines take traffic. A second Alembic
      # path in CI is how a half-migrated database happens.
      - name: Deploy
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 600

      # **Scheduled machines are not managed by `fly deploy`, and they do not say so.**
      #
      # `fly.toml` has no stanza for one — Fly creates them with `fly machine run`, and a
      # machine created that way has no process group. `fly deploy` only touches machines in
      # a process group, so the scheduler and the notifier pinned the image they were created
      # from and ran it for three days after the app moved on. Nothing failed. They fired on
      # time, every hour, executing older code, which is the version of this bug that does not
      # announce itself.
      #
      # So the deploy reaches them here. Two guards make this safe to run unattended:
      #
      #   * **Only machines with a non-empty `schedule`.** That is exactly the set `fly deploy`
      #     cannot see, and it can never match an `app` machine — those have no schedule.
      #   * **Only when the image actually differs**, so a no-op deploy does not restart the
      #     cron machines for nothing.
      #
      # `fly machine update` preserves the schedule, the restart policy, the command and the
      # env, so this is not a recreate and none of the flags that were got wrong by hand on
      # Aug 10 are restated here. If this step is ever removed, the machines resume drifting
      # silently — that is the whole reason it exists.
      - name: Refresh scheduled machines onto the deployed image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machines=$(flyctl machine list --app "$FLY_APP" --json)

          # The image the app machines are actually running, taken from the app itself rather
          # than reconstructed from a release id — the two have different shapes and only one
          # of them is what `--image` accepts.
          target=$(echo "$machines" \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")][0].config.image // empty')
          if [ -z "$target" ]; then
            echo "::error::No app machine found; refusing to guess an image."
            exit 1
          fi
          echo "app image: $target"

          stale=$(echo "$machines" \
            | jq -r --arg target "$target" \
                '.[] | select((.config.schedule // "") != "") | select(.config.image != $target) | .id')

          if [ -z "$stale" ]; then
            echo "every scheduled machine is already on the deployed image"
            exit 0
          fi

          for id in $stale; do
            echo "updating scheduled machine $id"
            flyctl machine update "$id" --app "$FLY_APP" --image "$target" --yes
          done

      # Fly can report a successful deploy while the release command errored, which would
      # put a running app in front of an unmigrated database. Ask explicitly.
      - name: Verify the release command succeeded
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          releases=$(flyctl releases --app "$FLY_APP" --json)
          status=$(echo "$releases" | jq -r '.[0].Status // "unknown"')
          version=$(echo "$releases" | jq -r '.[0].Version // "unknown"')
          echo "latest release: v$version, status=$status"

          # flyctl calls a healthy release "complete"; it reported "succeeded" when this was
          # written. Matching one spelling failed the first real deploy — v1 was `complete`,
          # the app was serving, the migration had run, and this step still went red. Accept
          # both rather than tracking whichever word flyctl prefers this month.
          case "$status" in
            succeeded|complete) ;;
            *)
              echo "::error::Release v$version finished with status '$status'."
              echo "::error::That usually means 'alembic upgrade head' failed. Logs follow."
              flyctl logs --app "$FLY_APP" --no-tail | tail -80 || true
              exit 1
              ;;
          esac

      # A green workflow has to mean the app is actually serving. /health touches the
      # database, so ok/ok proves the migration landed and the pool is alive.
      - name: Wait for the app to serve
        run: |
          set -uo pipefail
          url="https://${FLY_APP}.fly.dev/health"
          deadline=$(( SECONDS + HEALTH_TIMEOUT_SECONDS ))
          attempt=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            body=$(curl -fsS --max-time 10 "$url" 2>/dev/null || true)
            if [ "$body" = '{"status":"ok","db":"ok"}' ]; then
              echo "healthy after ${attempt} attempt(s): $body"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 5
          done

          echo "::error::$url did not return {\"status\":\"ok\",\"db\":\"ok\"} within ${HEALTH_TIMEOUT_SECONDS}s."
          echo "::error::The deploy and the release command both succeeded, so this is the app"
          echo "::error::failing to serve — most likely DATABASE_URL. Logs follow."
          flyctl logs --app "$FLY_APP" --no-tail | tail -80 || true
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Deployed :rocket:"
            echo ""
            echo "- app: \`$FLY_APP\`"
            echo "- commit: \`${GITHUB_SHA:0:8}\`"
            echo "- health: https://${FLY_APP}.fly.dev/health"
            echo "- docs: https://${FLY_APP}.fly.dev/docs"
          } >> "$GITHUB_STEP_SUMMARY"
