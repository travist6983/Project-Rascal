name: Prompt candidates

# The review queue, as a pull request. `docs/mission-library.md` calls for batch-generating
# candidates server-side with a real model into "a review queue you approve"; this is that,
# built out of the thing that is already an accept/reject interface with a comment thread,
# an audit trail, and an undo.
#
# This used to end "No table, no admin UI, no endpoint." As of phase 103 (Aug 20, 2026) there
# is an admin UI and there are two endpoints, and that sentence is exactly what someone would
# quote while deleting them — so it is gone rather than left to be read literally.
#
# **Both paths exist on purpose and this one is unchanged.** This is the batch path: a theme
# sweep, many candidates, reviewed in a diff, writing markdown worksheets and touching no
# database. The console is the interactive path: one brief, up to twenty-five, picked on the
# spot, written into `prompts` as `source='llm'`, `active=false`. They run the *same* filters
# out of `rascal/services/candidates.py`, so a rule changed in one place changes both.
#
# Manual by default. The monthly schedule is commented out rather than deleted so turning it
# on is one line — but a library that grows on a cron without anyone asking is how you end up
# with three hundred prompts nobody chose.
on:
  workflow_dispatch:
    inputs:
      thinnest:
        description: "Generate for the N themes with the fewest prompts"
        required: false
        default: "4"
      theme:
        description: "Or name one theme explicitly (overrides `thinnest` if set)"
        required: false
        default: ""
      kind:
        description: "question | photo | video | audio | activity | letter"
        required: false
        default: "question"
      count:
        description: "Candidates per theme"
        required: false
        default: "20"
      seasonal:
        description: "Allow prompts that need an occasion"
        type: boolean
        required: false
        default: false
  # schedule:
  #   - cron: "20 9 1 * *"

concurrency:
  group: prompt-candidates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. See docs/blocked.md."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate
        working-directory: api
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          args=(--kind "${{ inputs.kind }}" --count "${{ inputs.count }}")
          if [ -n "${{ inputs.theme }}" ]; then
            args+=(--theme "${{ inputs.theme }}")
          else
            args+=(--thinnest "${{ inputs.thinnest }}")
          fi
          if [ "${{ inputs.seasonal }}" = "true" ]; then
            args+=(--seasonal); fi
          uv run python scripts/generate_prompts.py "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: prompt-candidates/${{ github.run_id }}
          # A new branch per run. Two batches must not silently overwrite each other while
          # one of them is still open for review.
          title: "Prompt candidates — ${{ inputs.kind }}"
          commit-message: "chore(prompts): candidate batch for review"
          add-paths: docs/prompt-candidates
          delete-branch: true
          body: |
            Generated by `.github/workflows/prompt-candidates.yml`
            (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            **This is a worksheet, not a change.** Nothing here is seeded and nothing here is
            live. Reviewing it means:

            1. Delete the rows you do not want.
            2. Move the survivors into the right table in `docs/mission-library.md`.
            3. `uv run python scripts/mission_library_to_yaml.py`, then `make seed`.
            4. `api/tests/test_seeding.py` asserts the coverage table in the library —
               it will fail and tell you the new numbers.
            5. Delete the candidate file in the same commit.

            The rejected rows are kept on purpose. A batch where half the candidates trip the
            same filter is telling you the instructions need work, and that is invisible if
            the failures are thrown away.
