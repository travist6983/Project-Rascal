name: Backup

# In GitHub Actions rather than on a Fly machine, deliberately: the backup has to still run
# on a day when Fly is the thing that is broken.
on:
  schedule:
    # 08:10 UTC — a few minutes off the hour, because the top of the hour is when every
    # cron on GitHub's fleet fires at once and jobs get queued.
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

env:
  # Tigris is globally distributed and has no AWS-style regions; `auto` is what it expects.
  # A real region name here signs a scope the endpoint rejects, and it reads as a credentials
  # failure rather than a configuration one. Unset the endpoint below to go back to AWS.
  AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
  AWS_ENDPOINT_URL_S3: ${{ vars.S3_ENDPOINT_URL || 'https://t3.storage.dev' }}
  # Keep this many of each. A month of dailies is not the same insurance as a year of
  # monthlies, and neither is expensive at this size.
  KEEP_DAILY: 7
  KEEP_WEEKLY: 4
  KEEP_MONTHLY: 12

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'rascal-media-prod' }}
        run: |
          missing=""
          [ -z "$BACKUP_DATABASE_URL" ] && missing="$missing BACKUP_DATABASE_URL"
          [ -z "$AWS_ACCESS_KEY_ID" ] && missing="$missing AWS_ACCESS_KEY_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "::error::See docs/DEPLOY.md section 4."
            exit 1
          fi
          echo "bucket: $S3_BUCKET"

      # Neon runs Postgres 16 and the client major has to match it exactly. Too old and
      # pg_dump refuses to dump a newer server; too new and it writes settings the server
      # will reject on the way back in — pg_dump 17 emits `SET transaction_timeout`, which
      # Postgres 16 does not recognise, so the dump restores nowhere. That failure only
      # surfaces on the day you need the backup, which is the worst possible day to find it.
      - name: Install postgresql-client-16
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          # /usr/bin/pg_dump is pg_wrapper, which dispatches to the newest installed version.
          # On a runner that already ships 17, installing 16 alongside it changes nothing
          # unless 16 comes first on PATH.
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version | grep -qE ' 16\.' \
            || { echo "::error::pg_dump is not 16: $(pg_dump --version)"; exit 1; }

      - name: Dump and upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'rascal-media-prod' }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          prefix="backups/$(date -u +%Y/%m)"
          file="rascal-${stamp}.sql.gz"

          # --no-owner/--no-privileges so the dump restores into any role, which is what a
          # restore into a fresh database or a local machine actually needs.
          pg_dump "$BACKUP_DATABASE_URL" \
            --format=plain --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > "$file"

          bytes=$(stat -c%s "$file")
          echo "dumped $file (${bytes} bytes)"

          # A dump that is basically empty means pg_dump succeeded against the wrong thing.
          if [ "$bytes" -lt 1024 ]; then
            echo "::error::Dump is only ${bytes} bytes. That is not a real backup."
            exit 1
          fi

          # Prove it is intact before it counts as a backup.
          gzip -t "$file"
          if ! zcat "$file" | grep -q 'CREATE TABLE public.entries'; then
            echo "::error::Dump does not contain the entries table. Wrong database?"
            exit 1
          fi

          # STANDARD_IA is an AWS storage class and Tigris tiers objects itself, so it is
          # deliberately not passed. --endpoint-url is explicit rather than relying on the
          # CLI picking up AWS_ENDPOINT_URL_S3, so a CLI version change cannot quietly send
          # a backup to Amazon instead.
          aws s3 cp "$file" "s3://${S3_BUCKET}/${prefix}/${file}" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" --only-show-errors
          echo "uploaded s3://${S3_BUCKET}/${prefix}/${file}"
          echo "BACKUP_KEY=${prefix}/${file}" >> "$GITHUB_ENV"
          echo "BACKUP_BYTES=${bytes}" >> "$GITHUB_ENV"

      - name: Prune old backups
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'rascal-media-prod' }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL || 'https://t3.storage.dev' }}
        run: python3 .github/scripts/prune_backups.py

      - name: Summary
        run: |
          {
            echo "### Backup complete :floppy_disk:"
            echo ""
            echo "- key: \`${BACKUP_KEY}\`"
            echo "- size: ${BACKUP_BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
