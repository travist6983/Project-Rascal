<!-- @dsCard group="Colors" viewport="700x200" subtitle="Terracotta is the only primary action; periwinkle is for written things" name="Action colors" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;align-items:center}</style>
</head><body>
<div style="display:flex;gap:26px;align-items:center">
<div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#C05A2B;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Terracotta</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#C05A2B</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#5566D6;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Periwinkle</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#5566D6</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#D9CFC2;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Disabled</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#D9CFC2</div></div></div>
<div style="display:flex;flex-direction:column;gap:9px">
<button style="padding:13px 26px;border:none;border-radius:999px;background:var(--rascal-terracotta);color:var(--rascal-canvas);font:700 15px var(--rascal-font-display);cursor:pointer">Record it</button>
<button style="padding:13px 26px;border:none;border-radius:999px;background:#4A56D6;color:var(--rascal-canvas);font:700 15px var(--rascal-font-display);cursor:pointer">Write it</button>
<button disabled style="padding:13px 26px;border:none;border-radius:999px;background:var(--rascal-ink-disabled);color:var(--rascal-canvas);font:700 15px var(--rascal-font-display)">Continue</button>
</div></div>
</body></html>
