<!-- @dsCard group="Colors" viewport="700x170" subtitle="Each badge pairs a tint fill with its own ink" name="Badge fills" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;align-items:center}</style>
</head><body>
<div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#F3D9C7;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Peach badge</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#F3D9C7</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#DADDF7;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Lav badge</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#DADDF7</div></div><div style="display:flex;flex-direction:column;gap:7px"><div style="width:84px;height:60px;border-radius:12px;background:#4B7A4F;border:1px solid rgba(35,37,60,.10)"></div><div style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Sage ink</div><div style="font:400 10.5px var(--rascal-font-mono);color:var(--rascal-muted)">#4B7A4F</div></div>
<div style="display:flex;flex-direction:column;gap:8px;margin-left:10px">
<span style="align-self:flex-start;padding:6px 13px;border-radius:999px;background:#F3D9C7;color:#C05A2B;font:700 11.5px var(--rascal-font-display);letter-spacing:.08em">PHOTO</span>
<span style="align-self:flex-start;padding:6px 13px;border-radius:999px;background:#DADDF7;color:#5566D6;font:700 11.5px var(--rascal-font-display);letter-spacing:.08em">QUESTION</span>
<span style="align-self:flex-start;padding:6px 13px;border-radius:999px;background:#E8F0E6;color:#4B7A4F;font:700 11.5px var(--rascal-font-display);letter-spacing:.08em">DID IT</span>
</div></div>
</body></html>
