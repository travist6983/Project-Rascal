<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const NS = window.RASCAL || window.RASCALDesignSystem || window.Rascal || {};
const { ChoiceRow, NameField } = NS;

function Demo() {
  const [v,setV] = React.useState('fast');
  return (
    <div style={{display:'flex',gap:22,alignItems:'flex-start'}}>
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:12}}>
        {[['voice',"I want to remember his voice"],['fast',"He's growing up too fast"],['hand',"I want to hand him something when he's older"]].map(([k,l])=>
          <ChoiceRow key={k} selected={v===k} onClick={()=>setV(k)}>{l}</ChoiceRow>)}
      </div>
      <div style={{width:240}}><NameField value="Milo" /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
