<!-- @dsCard group="Spacing" viewport="700x215" subtitle="22px content gutter, 88px safe top, 110px clearance under the tab bar" name="App gutters in use" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;align-items:center}</style>
</head><body>
<div style="position:relative;width:230px;height:160px;border-radius:18px;background:var(--rascal-canvas);border:1px solid var(--rascal-border);overflow:hidden">
<div style="position:absolute;inset:0 0 auto;height:34px;background:rgba(192,90,43,.10)"></div>
<div style="position:absolute;left:22px;right:22px;top:44px;height:52px;border-radius:14px;background:#F8E7DC"></div>
<div style="position:absolute;left:14px;right:14px;bottom:10px;height:28px;border-radius:16px;background:var(--rascal-surface);box-shadow:var(--rascal-shadow-tabbar)"></div>
</div>
<div style="margin-left:24px;display:flex;flex-direction:column;gap:5px;font:400 12px var(--rascal-font-mono);color:var(--rascal-muted)">
<span>--rascal-app-gutter: 22px</span><span>--rascal-app-gutter-wide: 30px</span><span>--rascal-app-safe-top: 88px</span><span>--rascal-app-safe-bottom: 34px</span><span>--rascal-app-tabbar-clearance: 110px</span></div>
</body></html>
