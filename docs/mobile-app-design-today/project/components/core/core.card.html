<!-- @dsCard group="Components" viewport="700x300" name="Core" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const NS = window.RASCAL || window.RASCALDesignSystem || window.Rascal || {};
const { Button, Card, Badge, EyebrowLabel, Wordmark } = NS;

function Demo() {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <Button block={false} size="md">Record it</Button>
        <Button block={false} size="md" tone="written">Write it</Button>
        <Button block={false} size="md" tone="secondary">Not now</Button>
        <Button block={false} size="md" tone="dark" radius="14px">Sign in with Apple</Button>
        <Button block={false} size="md" tone="quiet">Not tonight</Button>
        <Button block={false} size="md" disabled>Continue</Button>
      </div>
      <div style={{display:'flex',gap:9,alignItems:'center',flexWrap:'wrap'}}>
        <Badge kind="photo" /><Badge kind="voice" /><Badge kind="question" /><Badge kind="wrote" /><Badge kind="did" />
        <EyebrowLabel style={{marginLeft:8}}>Yesterday</EyebrowLabel>
        <Wordmark style={{marginLeft:8}} />
      </div>
      <div style={{display:'flex',gap:12}}>
        <Card style={{flex:1}}>Surface + hairline</Card>
        <Card tint="peach" radius="var(--rascal-radius-app-card)" style={{flex:1}}>Tint, no border</Card>
        <Card selected style={{flex:1}}>Selected</Card>
        <Card lifted style={{flex:1}}>Lifted</Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
