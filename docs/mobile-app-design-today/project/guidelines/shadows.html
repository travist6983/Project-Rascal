<!-- @dsCard group="Spacing" viewport="700x185" subtitle="Two shadows plus three fixed-element specials. No inner shadows, ever." name="Shadows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;align-items:center}</style>
</head><body>
<div style="display:flex;gap:22px;align-items:center">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:64px;border-radius:20px;background:var(--rascal-surface);border:1px solid var(--rascal-border);box-shadow:var(--rascal-shadow)"></div><span style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Resting</span><span style="font:400 9.5px var(--rascal-font-mono);color:var(--rascal-muted)">--rascal-shadow</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:64px;border-radius:20px;background:var(--rascal-surface);border:1px solid var(--rascal-border);box-shadow:var(--rascal-shadow-lift)"></div><span style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Lift</span><span style="font:400 9.5px var(--rascal-font-mono);color:var(--rascal-muted)">--rascal-shadow-lift</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:64px;border-radius:20px;background:var(--rascal-surface);border:1px solid var(--rascal-border);box-shadow:var(--rascal-shadow-tabbar)"></div><span style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">Tab bar</span><span style="font:400 9.5px var(--rascal-font-mono);color:var(--rascal-muted)">--rascal-shadow-tabbar</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:56px;height:56px;border-radius:999px;background:var(--rascal-terracotta);box-shadow:var(--rascal-shadow-fab)"></div><span style="font:600 11px var(--rascal-font-body);color:var(--rascal-ink)">FAB</span><span style="font:400 9.5px var(--rascal-font-mono);color:var(--rascal-muted)">tinted</span></div></div>
</body></html>
