[project]
name = "rascal"
version = "0.1.0"
description = "RASCAL — backend for a childhood archive, one daily prompt at a time."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    # http2 is not optional here: APNs speaks HTTP/2 and nothing else, so the `h2` extra is
    # what makes rascal.services.push.ApnsClient able to open a connection at all.
    "httpx[http2]>=0.28",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "app-store-server-library>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "moto[s3]>=5.0",
    "ruff>=0.8",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rascal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the documented idiom.
    "RUF012", # Mutable class attrs on declarative models are the SQLAlchemy idiom.
]

[tool.ruff.lint.isort]
known-first-party = ["rascal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `scripts/` on the path so tests can drive restore.py directly.
pythonpath = [".", "tests"]
filterwarnings = ["error::DeprecationWarning:rascal.*"]
