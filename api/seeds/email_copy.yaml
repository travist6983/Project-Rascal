welcome:
- index: 1
  day: 0
  subject: Your first question
  body: 'That''s you on the list. Here''s the first one.


    **What did they say today that you want to remember?**


    Write it down somewhere — a notes app, a napkin, the back of your hand. The point isn''t where. The
    point is that in nine years you will not remember it, and right now you do.


    That''s the whole idea behind Pocket Chronicle. One question a day about your kid, and one small mission
    — take a photo, record their voice, get on the floor for ten minutes. What you capture becomes a timeline
    they inherit, with the question that caused it still attached.


    A photo without context is a photo. A photo with the question that made you take it is a story.


    We''ll send you a question most days. No streaks, nothing to keep up with.'
- index: 2
  day: 2
  subject: The thing camera rolls can't do
  body: '**What are they afraid of right now?**


    Worth writing down, because it will change, and because you will forget that it was ever true.


    Here''s the thing about your camera roll: it already has eleven thousand photos of your kid. What
    it doesn''t have is why. Which one was the day they finally let go of the couch. Which blurry one
    is the good one.


    Pocket Chronicle isn''t storage. You''ve got storage. It''s the prompt, the context, and being able
    to find it again in 2040.'
- index: 3
  day: 5
  subject: Some days you just get on the floor
  body: '**What''s a small thing they''re better at than they were a month ago?**


    A note on missions, since a couple of you asked.


    Not every mission produces something to upload. "Get on the floor and play for ten minutes" makes
    nothing you can post, and it is a complete, legitimate entry in the archive. So is a sentence you
    typed. So is a photo.


    Three shapes: you did it, you captured it, you wrote it. All three count the same.


    Most apps in this category quietly assume a photo. Ours doesn''t, and that was a decision, not an
    oversight.'
- index: 4
  day: 9
  subject: Missed a few?
  body: '**What do they do that nobody else would notice?**


    If you haven''t written anything down since the first email — that''s fine, and it''s the reason this
    email exists.


    Pocket Chronicle has no streaks. Nothing turns red. Missed prompts stack up quietly and expire after
    two weeks without ever mentioning it again. An app that makes you feel worse about parenting has failed
    at the only thing it was for.


    The exit test we used while building it wasn''t a feature list. It was: did I use this for seven days
    without forcing myself.'
- index: 5
  day: 16
  subject: Where this is going
  body: '**What''s something they believe right now that isn''t true?**


    Write that one down. Trust me.


    Quick note on what Pocket Chronicle actually is, since you''ve been getting these for a couple of
    weeks.


    It''s an iPhone app. One question a day, one mission, a bigger mission weekly, a measurement monthly.
    Everything lands on a searchable timeline — searchable through what was said, not just when it happened,
    because voice recordings get transcribed.


    It''s built to be handed over. Not exported into a folder someone loses. Handed over, as a thing with
    the questions still attached.


    It''s being built by one person in the evenings, for one four-year-old, and it works. You''ll hear
    from us when it''s ready for anyone else.


    Until then: the questions keep coming.'
