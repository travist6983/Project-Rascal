# Fly.io configuration for the RASCAL API.
#
# Deploy from api/:  fly deploy
# Full runbook:      docs/runbook-deploy.md

app = "rascal-api"
primary_region = "ord"          # Chicago — closest Fly region to Detroit.

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once, before the new machines take traffic. A failed migration fails the deploy
  # instead of leaving a running app in front of the wrong schema.
  #
  # **The seed runs here too, and it has to.** Phase 24 tokenised all 113 prompt bodies and
  # merged; the migration that came with phase 35 applied itself on the next deploy, and the
  # bodies did not, because nothing anywhere invoked the loader. Production spent a day
  # serving `his hands` from rows whose *theme* had been renamed to `their-words` — a
  # half-applied state that is worse than either end of it, and that nothing reported.
  #
  # Idempotent by construction: the loader keys on `sha256(kind, cadence, body)`, updates
  # what changed, inserts what is new, and deactivates seeded rows the file no longer
  # contains. A deploy that changes no prompts is `0 inserted, 0 updated, 0 retired`.
  #
  # Chained with `&&` rather than added as a second CI step on purpose — the comment in
  # `.github/workflows/deploy.yml` about a second Alembic path applies here identically. One
  # path, and a failure fails the deploy instead of leaving the app in front of a library
  # that does not match the file it was built from.
  release_command = "sh -c 'alembic upgrade head && python -m rascal.jobs.seed'"
  strategy = "rolling"

[env]
  ENVIRONMENT = "prod"

  # Tigris is globally distributed and has no AWS-style regions; `auto` is what it expects.
  # A real region name here signs a scope the endpoint rejects, and the failure reads as bad
  # credentials rather than bad configuration. This said `us-east-2` — the exact value
  # docs/tigris-setup.md calls "the single most likely way to break this".
  S3_REGION = "auto"

  # Unset means real AWS. That is the dangerous default: presigning is an offline signature
  # computation, so an unset endpoint does not fail at boot or fail the health check — it
  # succeeds all the way to handing the phone an `amazonaws.com` URL that 403s. From inside
  # Fly, Tigris is reached here; from a laptop or GitHub Actions it is https://t3.storage.dev.
  S3_ENDPOINT_URL = "https://fly.storage.tigris.dev"

  # Everything secret is a Fly secret, never an env entry. See docs/runbook-deploy.md.
  #
  # The two values above are deliberately *not* secrets, and must not also be set with
  # `fly secrets set`: when a name appears in both, which one the machine sees is a detail
  # of flyctl's version, and a config value that depends on that is a config value nobody
  # can reason about at 11pm. S3_BUCKET stays a secret only because its name is generated
  # at bucket-creation time and is not known to this file.

[processes]
  app = "uvicorn rascal.main:app --host 0.0.0.0 --port 8080 --workers 1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine always up: a cold start on the morning the widget fires is the one time
  # this has to be instant.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # /health touches the database, so a green check means the app can actually serve.
    path = "/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

# --- The scheduler ---------------------------------------------------------------------------
#
# Read this before changing anything above: **the archive does not depend on any of it.**
#
# `GET /v1/children/{id}/today` fills the day's empty slots itself, idempotently, on the
# child's local date, using the scheduler's own selection code. So a scheduled machine that
# never fires costs a few milliseconds on the first read of the day, not a lost day. That is
# the durability guarantee; everything below is an optimisation on top of it. See
# `ensure_day_filled` in src/rascal/services/scheduler.py and docs/decisions.md.
#
# What the scheduler is still needed for is **expiry** — the read path deliberately does not
# expire lapsed work, so without a periodic run the `waiting` list grows without bound. That
# is a slow product problem, not a data-loss one.
#
# `min_machines_running = 1` above matters for the same reason: it keeps the machine that
# serves the read path awake, so the safety net is always reachable. Roughly $3/month for a
# shared-cpu-1x/512mb machine at Fly's published rates — confirm against current pricing.
#
# fly.toml has no stanza for a scheduled machine — Fly creates them with `fly machine run`,
# and a machine created that way is not managed by `fly deploy`. Two consequences, both of
# which are reasons not to let the archive rest on it:
#
#   1. A fresh app has no scheduler at all until someone runs the command by hand, and
#      nothing fails if they forget.
#   2. It pins the image it was created from. Later deploys do not update it, so it can
#      quietly run months-old code. Recreate it when the job changes — see the runbook.
#
# The exact command is in docs/runbook-deploy.md, and it is this:
#
#   fly machine run registry.fly.io/rascal-api:deployment-<id> \
#     --app rascal-api \
#     --schedule hourly \
#     --region ord \
#     --vm-size shared-cpu-1x \
#     --vm-memory 512 \
#     --restart no \
#     --env ENVIRONMENT=prod \
#     --env S3_REGION=auto \
#     --env S3_ENDPOINT_URL=https://fly.storage.tigris.dev \
#     -- python -m rascal.jobs.scheduler
#
# Three things in that command are not decoration, and the version without them was run on
# Aug 10, 2026 and produced a machine that did the wrong thing quietly:
#
#   * **`fly machine run` does not read this file.** Nothing in `[env]` above reaches a
#     machine created this way — only `fly deploy` applies it — so the three `--env` flags
#     restate it by hand. Without them the job dies on `s3_region Field required`, which is
#     a startup crash rather than a wrong answer, so at least it is loud.
#   * **The command goes after `--`, not in `--command`.** `--command` is for `--shell` and
#     is otherwise ignored *silently*: the machine falls back to this image's default CMD
#     and runs a second copy of uvicorn, hourly, forever. The `--` matters too — `-m` is
#     flyctl's shorthand for `--metadata` and it swallows the module name.
#   * **`--restart no`.** The job runs to completion and exits 0; the default `on-failure`
#     policy turns a bad config into three reboots instead of one clean failure.
#
# Hourly, not daily. A single daily cron fires at one UTC hour, which is 5am in exactly one
# timezone and drifts an hour against DST twice a year. Firing hourly and letting the job
# select the children for whom it is currently 5am on the wall costs 24 tiny wakeups a day
# and removes that entire class of bug.
#
# The job is idempotent — the unique index on (child_id, assigned_on, slot) makes a rerun
# free — so a duplicate firing or a manual re-run costs nothing.
